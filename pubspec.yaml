name: Build TUPO APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
      - name: Clean bad files
        run: |
          rm -f "main. dart>Edit file>Delete all>" || true
          rm -f "pubspec . yaml" || true
          ls -la
          ls -la lib/
      - name: Get dependencies
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TUPO-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
